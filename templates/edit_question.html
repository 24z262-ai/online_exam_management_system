{% extends 'base.html' %}{% block title %}Edit question{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">EXAM BUILDER · EDIT QUESTION</p><h1>Update this question</h1><p class="muted">Correct the wording or options, then save your changes.</p></div><a class="secondary button" href="{{ url_for('manage_questions',exam_id=question.exam_id) }}">← Back to questions</a></div><section class="panel form-panel builder-form"><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Question<textarea name="question_text" required rows="4">{{ question.question_text }}</textarea></label><div class="option-fields"><label><span><b class="option-letter">A</b>Option A</span><input name="option_a" required value="{{ question.option_a }}"></label><label><span><b class="option-letter">B</b>Option B</span><input name="option_b" required value="{{ question.option_b }}"></label><label><span><b class="option-letter">C</b>Option C</span><input name="option_c" required value="{{ question.option_c }}"></label><label><span><b class="option-letter">D</b>Option D</span><input name="option_d" required value="{{ question.option_d }}"></label></div><label>Correct answer<select name="correct_answer">{% for letter in 'ABCD' %}<option value="{{ letter }}" {% if question.correct_answer == letter %}selected{% endif %}>Option {{ letter }}</option>{% endfor %}</select></label><div class="form-actions"><button class="primary">Save question changes <span>✓</span></button><a class="secondary button" href="{{ url_for('manage_questions',exam_id=question.exam_id) }}">Cancel</a></div></form></section>{% endblock %}
